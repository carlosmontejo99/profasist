<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Gestión de asistencia offline para profesores." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProfAsist" />
    
    <title>ProfAsist</title>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/index.css" />

    <style>
      :root {
        /* Fallbacks to prevent zero-height overlaps on some immersive WebViews */
        --sat: 0px;
        --sat: env(safe-area-inset-top);
        --sab: 0px;
        --sab: env(safe-area-inset-bottom);
        --sal: 0px;
        --sal: env(safe-area-inset-left);
        --sar: 0px;
        --sar: env(safe-area-inset-right);
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        /* Padding dinámico para la barra de estado y gestos de Android */
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        background-color: #f8fafc; /* Slate 50 por defecto para tema claro */
        transition: background-color 200ms;
      }
      html.dark body {
        background-color: #090d16; /* Slate 950 oscuro para tema oscuro */
      }
      input, textarea {
        user-select: text;
      }
      .safe-area-bottom {
        padding-bottom: calc(1rem + var(--sab));
      }
      html.transition-colors, 
      html.transition-colors body, 
      html.transition-colors div, 
      html.transition-colors button {
        transition-property: background-color, border-color, color;
        transition-duration: 200ms;
      }
      /* Fix para que el fondo ocupe todo incluso con insets */
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
</head>
  <body class="bg-gray-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen w-screen overflow-hidden transition-colors">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
