<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Gestión de asistencia offline para profesores." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProfAsist" />
    
    <title>ProfAsist</title>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/index.css" />

    <style>
      :root {
        /* Fallbacks to prevent zero-height overlaps on some immersive WebViews */
        --sat: 0px;
        --sat: env(safe-area-inset-top);
        --sab: 0px;
        --sab: env(safe-area-inset-bottom);
        --sal: 0px;
        --sal: env(safe-area-inset-left);
        --sar: 0px;
        --sar: env(safe-area-inset-right);
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        /* Padding dinámico para la barra de estado y gestos de Android */
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        background-color: #f8fafc; /* Slate 50 por defecto para tema claro */
        transition: background-color 200ms;
      }
      html.dark body {
        background-color: #090d16; /* Slate 950 oscuro para tema oscuro */
      }
      input, textarea {
        user-select: text;
      }
      .safe-area-bottom {
        padding-bottom: calc(1rem + var(--sab));
      }
      html.transition-colors, 
      html.transition-colors body, 
      html.transition-colors div, 
      html.transition-colors button {
        transition-property: background-color, border-color, color;
        transition-duration: 200ms;
      }
      /* Fix para que el fondo ocupe todo incluso con insets */
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* --- PROFASIST SPLASH --- */
      #profasist-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 100% at 50% 0%, #312e81 0%, #0f172a 58%, #020617 100%);
        color: #ffffff;
        transition: opacity 450ms ease, visibility 450ms ease;
      }
      #profasist-splash.is-hiding {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .ps-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: ps-rise 550ms cubic-bezier(.2, .8, .2, 1);
      }
      .ps-logo {
        width: 92px;
        height: 92px;
        border-radius: 26px;
        box-shadow:
          0 24px 60px -18px rgba(79, 70, 229, .75),
          0 0 0 1px rgba(255, 255, 255, .14) inset;
      }
      .ps-title {
        font: 900 30px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -.04em;
      }
      .ps-sub {
        font: 800 9px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: #c7d2fe;
      }
      .ps-bar {
        width: 150px;
        height: 3px;
        margin-top: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .14);
        overflow: hidden;
      }
      .ps-bar span {
        display: block;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #818cf8, #c7d2fe);
        animation: ps-load 1000ms ease-in-out infinite;
      }
      @keyframes ps-rise {
        from { opacity: 0; transform: translateY(10px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes ps-load {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ps-card { animation: none; }
        .ps-bar span { animation: none; width: 100%; }
      }
    </style>
</head>
  <body class="bg-gray-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen w-screen overflow-hidden transition-colors">
    <div id="profasist-splash" role="status" aria-label="Cargando ProfAsist">
      <div class="ps-card">
        <img class="ps-logo" src="/icon.svg" alt="" />
        <div class="ps-title">ProfAsist</div>
        <div class="ps-sub">Gestión docente soberana</div>
        <div class="ps-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Service Worker solo en navegadores PWA, desintervenir en Capacitor WebView para evitar cache de hashes antiguos
      if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform()) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      } else if ('serviceWorker' in navigator && window.Capacitor?.isNativePlatform()) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
    <script>
      // Splash: 1500 ms después de load (3x la duración original), con fallback de 4 s.
      (function () {
        var splash = document.getElementById('profasist-splash');
        if (!splash) return;
        var finished = false;
        function hide() {
          if (finished) return;
          finished = true;
          splash.classList.add('is-hiding');
          window.setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 480);
        }
        function schedule() {
          window.setTimeout(hide, 1500);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
        window.setTimeout(hide, 4000);
      })();
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
