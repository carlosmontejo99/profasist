name: Reporte de error
description: Reportar un problema reproducible de ProfAsist
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: No incluyas nombres, matrículas, correos, calificaciones ni respaldos reales.
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 3.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo y versión de Android
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtenido
    validations:
      required: true
